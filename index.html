<!DOCTYPE html>
<html>
<head>
  <title>Grow A Tree Focus</title>
  <style>
    body {
      font-family: Arial;
      background: #e8f5e9;
      padding: 20px;
    }
    #tree {
      font-size: 40px;
      text-align: center;
      margin: 20px 0;
    }
    #forest {
      margin-top: 20px;
      padding: 10px;
      background: #c8e6c9;
    }
    .tree-icon {
      font-size: 30px;
      margin-right: 5px;
    }
    #crafting button {
      margin: 5px;
      padding: 10px;
    }
  </style>
</head>
<body>

<h1>🌳 Focus Tree App</h1>

<button id="startBtn">Start Focus Session</button>
<p id="timer">Timer: 0 min</p>

<div id="tree">🌱</div>

<h3>Resources</h3>
<p>Wood: <span id="wood">0</span></p>

<h3>Crafting</h3>
<div id="crafting">
  <button onclick="craftBench()">Craft Bench (10 wood)</button>
  <button onclick="craftLantern()">Craft Lantern (20 wood)</button>
</div>

<h3>Your Forest</h3>
<div id="forest"></div>

<script src="app.js"></script>
</body>
</html>
