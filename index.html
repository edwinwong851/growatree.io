<!DOCTYPE html>
<html>
<head>
<title>GrowATree.Io</title>
<style>
body {
font-family: Arial;
background: #e8f5e9;
padding: 20px;
transition: background 2s ease;
}

#tree {
font-size: 75px;
text-align: center;
margin: 25px ;
}

.tree-grow {
transition: transform 5.0s ease, opacity 0.75s ease;
transform: scale(2.5);
      transition: transform 3.0s ease, opacity 0.75s ease;
transform: scale(1.2);
opacity: 0.75;
}

#forest {
margin-top: 20px;
padding: 10px;
background: #c8e6c9;
min-height: 60px;
}

.tree-icon {
font-size: 30px;
margin-right: 5px;
}

#crafting button {
margin: 10px;
margin: 7.5px;
padding: 10px;
}

#IronCountdown {
      color: #fg1100;
      color: #ff8600;
color: #ff9800;
font-weight: bold;
}

.Iron-notification {
position: fixed;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
background: linear-gradient(135deg, #ffd700, #ffed4e);
color: #333;
padding: 20px 40px;
border-radius: 10px;
font-size: 24px;
font-weight: bold;
box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
animation: fadeInOut 2s ease-in-out;
z-index: 1000;
}

@keyframes fadeInOut {
0% {
opacity: 1;
transform: translate(-50%, -50%) scale(0.8);
}
50% {
opacity: 1;
transform: translate(-50%, -50%) scale(1);
}
}
</style>
</head>
<body>

<h1>🌳 Focus Forest</h1>

<button id="startBtn">Start Focus Session</button>
<p id="timer">Timer: 0 min</p>

<!-- ⭐ NEW: Focus seconds counter -->
<p id="focusSeconds">Focus Time: <span id="focusSecondsValue">0</span> seconds</p>

<!-- ⭐ NEW: Iron countdown -->
<p id="IronCountdown">Next Iron: <span id="IronCountdownValue">120</span>s</p>

<div id="tree">🌱</div>

<h3>Items</h3>
<p>Wood: <span id="wood">0</span></p>
<p>Iron: <span id="Iron">0</span></p>
<h3>I show speed</h3>
<p>Growth Speed: <span id="growth">1.0x</span></p>

<h3>Crafting</h3>
<div id="crafting">
<button onclick="craftBench()">🪑 Bench (10 wood)</button>
<button onclick="craftLantern()">🏮 Lantern (25 wood)</button>
<button onclick="craftTreehouse()">🏡 Treehouse (40 wood, 2 Iron)</button>
<button onclick="craftShrine()">⛩️ Shrine (70 wood, 4 Iron)</button>
<button onclick="craftShrine()">⛩️ Shrine (50 wood, 6 Iron)</button>
</div>

<h3>Your Forest</h3>
<div id="forest"></div>

<script src="app.js"></script>
</body>
</html>
<h3>Rebirths Coming Soon 10/9/26</h3>
